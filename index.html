<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Diwali Everyone</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at bottom, #351052, #090018 75%);
    color: white;
    min-height: 100vh;
}

/* Stars */
.stars {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, white, transparent),
      radial-gradient(2px 2px at 100px 150px, #ffd700, transparent),
      radial-gradient(2px 2px at 250px 80px, white, transparent),
      radial-gradient(2px 2px at 350px 250px, #ffb6c1, transparent);
    background-size: 400px 300px;
    animation: starsMove 5s linear infinite;
}

@keyframes starsMove {
    from { transform: translateY(0); }
    to { transform: translateY(-100px); }
}

/* Main content */
.container {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: clamp(38px, 8vw, 85px);
    color: #ffd700;
    text-shadow:
        0 0 10px #ff8c00,
        0 0 25px #ff4500,
        0 0 50px #ff1493;
    animation: headingGlow 2s infinite alternate;
}

@keyframes headingGlow {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
}

.subtitle {
    font-size: clamp(18px, 4vw, 30px);
    margin-top: 20px;
    color: #fff2b2;
    text-shadow: 0 0 15px orange;
}

.name {
    margin-top: 25px;
    font-size: 22px;
    color: #ffb6c1;
}

/* Diyas */
.diya-area {
    position: absolute;
    bottom: 45px;
    width: 100%;
    display: flex;
    justify-content: space-evenly;
    z-index: 6;
}

.diya {
    position: relative;
    font-size: 55px;
    animation: diyaGlow 1.5s infinite alternate;
}

@keyframes diyaGlow {
    from { filter: drop-shadow(0 0 5px orange); }
    to { filter: drop-shadow(0 0 25px gold); }
}

/* Fireworks */
.firework {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    animation: explode 1.5s ease-out infinite;
}

@keyframes explode {
    0% {
        box-shadow: 0 0 0 0 #ff0;
        opacity: 1;
        transform: scale(0.2);
    }

    100% {
        box-shadow:
            0 -70px #ff0,
            50px -50px #ff4500,
            70px 0 #00ffff,
            50px 50px #ff00ff,
            0 70px #00ff00,
            -50px 50px #ff1493,
            -70px 0 #00ffff,
            -50px -50px #ffa500;
        opacity: 0;
        transform: scale(1.5);
    }
}

/* Rockets */
.rocket {
    position: absolute;
    bottom: -50px;
    font-size: 30px;
    animation: rocketFly 3s linear infinite;
}

@keyframes rocketFly {
    0% {
        transform: translateY(0) rotate(-45deg);
        opacity: 1;
    }
    85% { opacity: 1; }
    100% {
        transform: translateY(-110vh) rotate(-45deg);
        opacity: 0;
    }
}

/* Button */
button {
    margin-top: 30px;
    padding: 13px 28px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg, #ff8c00, #ffd700);
    color: #4b1600;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px orange;
}

button:hover {
    transform: scale(1.08);
}

.footer {
    position: absolute;
    bottom: 12px;
    width: 100%;
    text-align: center;
    color: #ffd700;
    font-size: 13px;
    z-index: 7;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

    <h1>🪔 Happy Diwali 🪔</h1>

    <div class="subtitle">
        All of You Friends ❤️
        <br>
        May Your Life Shine Like Diyas!
    </div>

    <div class="name">
        ✨ Best Wishes From Ashutosh Gupta ✨
    </div>

    <button onclick="celebrate()">
        🎆 Celebrate Diwali
    </button>

</div>

<!-- Diyas -->
<div class="diya-area">
    <div class="diya">🪔</div>
    <div class="diya">🪔</div>
    <div class="diya">🪔</div>
    <div class="diya">🪔</div>
    <div class="diya">🪔</div>
</div>

<div class="footer">
    Made With ❤️ For All My Friends
</div>

<script>

// Create fireworks
function createFirework() {

    const firework = document.createElement("div");

    firework.className = "firework";

    firework.style.left = Math.random() * 100 + "vw";
    firework.style.top = Math.random() * 65 + "vh";
    firework.style.animationDelay = Math.random() + "s";

    document.body.appendChild(firework);

    setTimeout(() => {
        firework.remove();
    }, 1600);
}

// Continuous fireworks
setInterval(createFirework, 450);

// Create flying rockets
function createRocket() {

    const rocket = document.createElement("div");

    rocket.className = "rocket";
    rocket.innerHTML = "🚀";

    rocket.style.left = Math.random() * 90 + "vw";
    rocket.style.animationDuration = (2 + Math.random() * 2) + "s";

    document.body.appendChild(rocket);

    setTimeout(() => {
        rocket.remove();
    }, 4000);
}

setInterval(createRocket, 1800);

// Celebration button
function celebrate() {

    for (let i = 0; i < 15; i++) {
        setTimeout(createFirework, i * 100);
    }

    alert("🎆 Happy Diwali All of You Friends! ❤️");
}

</script>

</body>
</html>
